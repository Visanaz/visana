# Production command; HTTPS terminates at the trusted Cloud Run frontend.
# Cloud hostname and every credential are supplied at runtime, never at build.
db=postgres
http-enabled=true
http-host=0.0.0.0
http-port=8080
http-management-scheme=http
http-management-port=9000
hostname-strict=true
proxy-headers=xforwarded
cache=local
db-pool-initial-size=1
db-pool-min-size=1
db-pool-max-size=10
log-level=INFO
