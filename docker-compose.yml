version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: visana_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pwd
      MYSQL_DATABASE: visanaco_produc
    ports:
      - "3308:3306"
    volumes:
      - visana_db_data:/var/lib/mysql

volumes:
  visana_db_data:
