name: Deploy Backend to Cloud Run (DEV)

on:
  workflow_call:
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_CREDENTIALS:
        required: true
      DEV_HEALTHCHECK_CLIENT_SECRET:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-visana-api-dev
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      REPO_NAME: visana-repo
      SERVICE_NAME: visana-api-dev
      DB_URL: ${{ vars.DB_URL }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD_SECRET_REF: ${{ vars.DEV_DB_PASSWORD_SECRET_REF }}
      DB_CREDENTIAL_ROTATION_CONFIRMED: ${{ vars.DEV_DB_CREDENTIAL_ROTATION_CONFIRMED }}
      KEYCLOAK_ISSUER_URI: ${{ vars.KEYCLOAK_ISSUER_URI }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.DEV_RUNTIME_SERVICE_ACCOUNT }}
      HEALTHCHECK_CLIENT_ID: ${{ vars.DEV_HEALTHCHECK_CLIENT_ID }}
      HEALTHCHECK_SUBJECT: ${{ vars.DEV_HEALTHCHECK_SUBJECT }}
      HEALTHCHECK_AUDIENCE: ${{ vars.DEV_HEALTHCHECK_AUDIENCE }}
      HEALTHCHECK_CLIENT_SECRET: ${{ secrets.DEV_HEALTHCHECK_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required external configuration without printing values
        run: python3 -B scripts/ci/cloud_run_dev.py config
      - name: Download the JAR verified in this workflow run
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: .ci-artifact
      - name: Check artifact provenance and executable classpath
        run: python3 -B scripts/ci/check_artifact.py .ci-artifact "$GITHUB_SHA"
      - name: Authenticate using the existing deployment identity
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect the existing service and preserve its identity and secret references
        id: existing
        run: |
          umask 077
          python3 -B scripts/ci/cloud_run_dev.py capture-service "$RUNNER_TEMP/service-before.json"
          python3 -B scripts/ci/cloud_run_dev.py existing "$RUNNER_TEMP/service-before.json"
          python3 -B scripts/ci/cloud_run_dev.py token
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Publish image and record immutable digest
        id: image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:$GITHUB_SHA"
          docker build --platform linux/amd64 --tag "$image" .
          docker push "$image"
          digest=$(gcloud artifacts docker images describe "$image" --project="$PROJECT_ID" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid image digest'; exit 1; }
          echo "reference=${image%:*}@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy DEV preserving IAM, networking and runtime identity
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service: visana-api-dev
          region: us-central1
          suffix: ci-${{ github.run_id }}-${{ github.run_attempt }}
          image: ${{ steps.image.outputs.reference }}
          env_vars_file: ${{ runner.temp }}/dev-env.json
          env_vars_update_strategy: merge
          secrets: ${{ steps.existing.outputs.db_password_secret }}
          secrets_update_strategy: merge
          flags: '--port=8080 --service-account=${{ vars.DEV_RUNTIME_SERVICE_ACCOUNT }}'
      - name: Verify this revision, its image digest and authenticated database health
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          umask 077
          revision="$SERVICE_NAME-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B scripts/ci/cloud_run_dev.py capture-revision "$RUNNER_TEMP/revision.json"
          python3 -B scripts/ci/cloud_run_dev.py capture-service "$RUNNER_TEMP/service-after.json"
          python3 -B scripts/ci/cloud_run_dev.py revision "$RUNNER_TEMP/revision.json" "$RUNNER_TEMP/service-after.json"
          python3 -B scripts/ci/cloud_run_dev.py health
      - name: Sanitized failure summary
        if: failure()
        run: |
          echo 'DEV deployment failed. No full service configuration or application logs are printed.'
          echo "Inspect service $SERVICE_NAME in region $REGION; candidate revision $SERVICE_NAME-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT."
      - name: Remove transient configuration and tokens
        if: always()
        run: rm -f "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-after.json" "$RUNNER_TEMP/revision.json" "$RUNNER_TEMP/dev-env.json" "$RUNNER_TEMP/cloud-run-token"
