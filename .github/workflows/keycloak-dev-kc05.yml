name: KC05_PRIVATE_KEYCLOAK_DEV_ONLY

on:
  push:
    branches:
      - ops/keycloak-dev-foundation

permissions:
  contents: read

concurrency:
  group: keycloak-dev-kc05
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Visanaz/visana' &&
      github.ref == 'refs/heads/ops/keycloak-dev-foundation' &&
      github.actor == 'KmDRF' &&
      github.triggering_actor == 'KmDRF'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Initialize sanitized evidence
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "kc05-deploy-result.json"
          target.write_text(json.dumps({
              "KC05_STATUS": "NOT_STARTED",
              "OWNER_VERIFIED_FOUNDATION": "YES",
              "SOURCE_SHA": "8701fc5b377af72665dce210203e43c0433a1fbd",
              "DEPLOY_ATTEMPTED": "NO",
              "KC06_AUTHORIZED": "NO"
          }, indent=2) + "\n", encoding="utf-8")

      - name: Verify PR and actor before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import subprocess
          def api(path):
              process = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if process.returncode:
                  raise SystemExit("GITHUB_PREFLIGHT_UNAVAILABLE")
              return json.loads(process.stdout)
          permission = api("repos/Visanaz/visana/collaborators/KmDRF/permission")
          if permission.get("permission") not in ("write", "maintain", "admin"):
              raise SystemExit("ACTOR_PERMISSION_MISMATCH")
          pr = api("repos/Visanaz/visana/pulls/20")
          if not (pr.get("state") == "open" and pr.get("draft") is True
                  and pr.get("merged_at") is None and pr["base"]["ref"] == "dev"
                  and pr["head"]["sha"] == "8701fc5b377af72665dce210203e43c0433a1fbd"):
              raise SystemExit("PR_PREFLIGHT_MISMATCH")
          print("PR_PREFLIGHT=PASS")

      - name: Checkout exact certified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8701fc5b377af72665dce210203e43c0433a1fbd
          path: approved-source
          persist-credentials: false

      - name: Verify exact source blobs
        shell: python
        run: |
          import subprocess
          source = "approved-source"
          head = subprocess.check_output(["git", "-C", source, "rev-parse", "HEAD"], text=True).strip()
          if head != "8701fc5b377af72665dce210203e43c0433a1fbd":
              raise SystemExit("SOURCE_SHA_MISMATCH")
          expected = {
              "infra/keycloak/Dockerfile": "dfe51748dc1c052ccb961d1368302ea6ffdcf3e1",
              "infra/keycloak/keycloak.conf": "608541333f0af59b0202838535c1c3b71e60e3e0",
              "infra/keycloak/visana-erp-realm.json": "452a1a2a0529a93b2cc0ce2ce08b739be42866f9",
              "infra/keycloak/cloud-run-service.template.json": "295ea8c1f8e91c279dc5aeb94e9a896afa01e21e",
              "scripts/ci/keycloak_dev.py": "bb25ac0a9057f363c32aac7db61b9ab11605f11c"
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(["git", "-C", source, "hash-object", path], text=True).strip()
              if actual != blob:
                  raise SystemExit("SOURCE_INTEGRITY_FAILED")
          print("SOURCE_INTEGRITY=PASS")

      - name: Authenticate exact DEV deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: visana-erp-dev

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Read-only post-failure diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          """Read-only KC-05 post-failure diagnosis for the temporary workflow."""
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          PROJECT = "visana-erp-dev"
          REGION = "us-central1"
          SERVICE = "visana-keycloak-dev"
          HOSTNAME = "https://visana-keycloak-dev-984938781030.us-central1.run.app"
          IMAGE = ("us-central1-docker.pkg.dev/visana-erp-dev/visana-repo/"
                   "visana-keycloak-dev@sha256:00462375f745a2f05afbc22b337fab23ae7a757846581edbab8f9afc14819b95")
          DEPLOYER = "github-actions-dev@visana-erp-dev.iam.gserviceaccount.com"
          output = Path(os.environ["RUNNER_TEMP"]) / "kc05-deploy-result.json"
          report = {
              "KC05_STATUS": "DIAGNOSTIC_ONLY",
              "SOURCE_SHA": "8701fc5b377af72665dce210203e43c0433a1fbd",
              "PREVIOUS_RUN": 36963116327,
              "DEPLOY_ATTEMPTED_THIS_RUN": "NO",
              "SERVICE_EXISTS_AFTER_FAILED_ATTEMPT": "UNKNOWN",
              "DRY_RUN_RESULT": "NOT_RUN",
              "DRY_RUN_ERROR": None,
              "KC06_READY_FOR_AUTHORIZATION": "NO",
              "PHASE2_GATE_IDP": "FAIL",
              "ALL_GATES_PASS": "NO",
              "KC06_AUTHORIZED": "NO",
          }


          def safe_error(value):
              line = next((part for part in value.splitlines() if "ERROR:" in part), "")
              if not line:
                  line = value.splitlines()[0] if value.splitlines() else ""
              line = re.sub(r"(?i)(password|token|credential|private_key)\s*[:=]\s*\S+",
                            r"\1=[REDACTED]", line)
              line = re.sub(r"[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{40,}",
                            "[REDACTED_JWT]", line)
              line = re.sub(r"[A-Za-z0-9+/=]{100,}", "[REDACTED_LONG_VALUE]", line)
              return line[:700]


          def run(args):
              return subprocess.run(args, capture_output=True, text=True, timeout=240, check=False)


          try:
              identity = run(["gcloud", "auth", "list", "--filter=status:ACTIVE",
                              "--format=value(account)"])
              if identity.returncode or identity.stdout.strip() != DEPLOYER:
                  raise RuntimeError("DEPLOYER_MISMATCH")
              report["ACTIVE_GCP_IDENTITY"] = DEPLOYER
              services = run(["gcloud", "run", "services", "list", "--project=" + PROJECT,
                              "--region=" + REGION, "--format=json"])
              if services.returncode:
                  raise RuntimeError("CLOUD_RUN_LIST_FAILED")
              items = json.loads(services.stdout)
              if not isinstance(items, list):
                  raise RuntimeError("CLOUD_RUN_LIST_INVALID")
              found = any(item.get("metadata", {}).get("name") == SERVICE or
                          item.get("name", "").endswith("/services/" + SERVICE)
                          for item in items)
              report["SERVICE_EXISTS_AFTER_FAILED_ATTEMPT"] = "YES" if found else "NO"
              if found:
                  detail = run(["gcloud", "run", "services", "describe", SERVICE,
                                "--project=" + PROJECT, "--region=" + REGION, "--format=json"])
                  if detail.returncode == 0:
                      data = json.loads(detail.stdout)
                      status = data.get("status", {})
                      report["REVISION"] = (status.get("latestCreatedRevisionName") or
                                            status.get("latestReadyRevisionName"))
                      report["ACTUAL_SERVICE_URL"] = status.get("url")
                      report["REVISION_READY"] = next(
                          (condition.get("status") for condition in status.get("conditions", [])
                           if condition.get("type") == "Ready"), "UNKNOWN")
                  else:
                      report["SERVICE_DESCRIBE_ERROR"] = safe_error(detail.stderr)
              else:
                  manifest = Path(os.environ["RUNNER_TEMP"]) / "kc05-service.json"
                  rendered = run([sys.executable, "approved-source/scripts/ci/keycloak_dev.py",
                                  "render", "--hostname", HOSTNAME, "--image", IMAGE,
                                  "--output", str(manifest)])
                  if rendered.returncode:
                      raise RuntimeError("RENDER_FAILED")
                  dry = run(["gcloud", "run", "services", "replace", str(manifest),
                             "--dry-run", "--project=" + PROJECT, "--region=" + REGION,
                             "--quiet"])
                  report["DRY_RUN_RESULT"] = "PASS" if dry.returncode == 0 else "FAIL"
                  if dry.returncode:
                      report["DRY_RUN_ERROR"] = safe_error(dry.stderr or dry.stdout)
          except (RuntimeError, ValueError, KeyError, OSError, subprocess.TimeoutExpired) as exc:
              report["DIAGNOSTIC_FAILURE"] = (
                  str(exc) if isinstance(exc, RuntimeError) else type(exc).__name__)
          finally:
              output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print("KC05_DIAGNOSTIC_ONLY=COMPLETE")

      - name: Upload sanitized KC-05 evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kc05-deploy-result
          path: ${{ runner.temp }}/kc05-deploy-result.json
          if-no-files-found: error
          retention-days: 14
