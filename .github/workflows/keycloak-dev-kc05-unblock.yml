name: KC05_UNBLOCK_READ_ONLY

on:
  push:
    branches: [ops/keycloak-dev-foundation]
    paths: [.github/workflows/keycloak-dev-kc05-unblock.yml]

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.repository == 'Visanaz/visana' &&
      github.ref == 'refs/heads/ops/keycloak-dev-foundation' &&
      github.actor == 'KmDRF' &&
      github.triggering_actor == 'KmDRF'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8701fc5b377af72665dce210203e43c0433a1fbd
          path: approved-source
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: visana-erp-dev
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Check effective permissions and dry run only
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          project = "visana-erp-dev"
          deployer = "github-actions-dev@visana-erp-dev.iam.gserviceaccount.com"
          runtime = "visana-keycloak-dev@visana-erp-dev.iam.gserviceaccount.com"
          report = {key: "UNKNOWN" for key in (
              "CLOUD_RESOURCE_MANAGER_API", "PROJECTS_GET", "RUN_SERVICES_CREATE",
              "RUN_SERVICES_GET", "RUN_OPERATIONS_GET", "ARTIFACT_DOWNLOAD",
              "ACT_AS_RUNTIME", "DRY_RUN_RESULT", "KC05_UNBLOCKED")}
          report.update({"DEPLOY_ATTEMPTED": "NO", "PR20_MODIFIED": "NO",
                         "IDENTITY": "UNKNOWN", "ERRORS": {}})

          def run(args):
              return subprocess.run(args, capture_output=True, text=True,
                                    timeout=180, check=False)

          def safe_error(message):
              value = next((line for line in message.splitlines() if "ERROR:" in line),
                           message.splitlines()[0] if message.splitlines() else "")
              value = value.split(" This command is authenticated as ")[0]
              value = re.sub(r"(?i)(password|token|credential|private_key)\s*[:=]\s*\S+",
                             r"\1=[REDACTED]", value)
              return value[:600]

          def api(url, token, permissions=None):
              data = None if permissions is None else json.dumps(
                  {"permissions": permissions}).encode("utf-8")
              request = urllib.request.Request(
                  url, data=data, headers={"Authorization": "Bearer " + token,
                                           "Content-Type": "application/json"},
                  method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(request, timeout=40) as response:
                      return json.load(response), None
              except urllib.error.HTTPError as exc:
                  return None, "HTTP_" + str(exc.code)
              except (urllib.error.URLError, TimeoutError) as exc:
                  return None, type(exc).__name__

          try:
              identity = run(["gcloud", "auth", "list", "--filter=status:ACTIVE",
                              "--format=value(account)"])
              if identity.returncode or identity.stdout.strip() != deployer:
                  raise RuntimeError("DEPLOYER_IDENTITY_MISMATCH")
              report["IDENTITY"] = deployer
              token_command = run(["gcloud", "auth", "print-access-token"])
              if token_command.returncode or not token_command.stdout.strip():
                  raise RuntimeError("ACCESS_TOKEN_UNAVAILABLE")
              token = token_command.stdout.strip()

              status, error = api("https://serviceusage.googleapis.com/v1/projects/"
                                  + project + "/services/cloudresourcemanager.googleapis.com", token)
              if error:
                  report["ERRORS"]["CLOUD_RESOURCE_MANAGER_API"] = error
              else:
                  report["CLOUD_RESOURCE_MANAGER_API"] = status.get("state", "UNKNOWN")

              project_perms = ["resourcemanager.projects.get", "run.services.create",
                               "run.services.get", "run.operations.get"]
              granted, error = api("https://cloudresourcemanager.googleapis.com/v3/projects/"
                                   + project + ":testIamPermissions", token, project_perms)
              fields = {"resourcemanager.projects.get": "PROJECTS_GET",
                        "run.services.create": "RUN_SERVICES_CREATE",
                        "run.services.get": "RUN_SERVICES_GET",
                        "run.operations.get": "RUN_OPERATIONS_GET"}
              if error:
                  report["ERRORS"]["PROJECT_IAM_TEST"] = error
              else:
                  allowed = set(granted.get("permissions", []))
                  for permission, field in fields.items():
                      report[field] = "YES" if permission in allowed else "NO"

              granted, error = api("https://artifactregistry.googleapis.com/v1/projects/"
                                   + project + "/locations/us-central1/repositories/visana-repo"
                                   + ":testIamPermissions", token,
                                   ["artifactregistry.repositories.downloadArtifacts"])
              if error:
                  report["ERRORS"]["ARTIFACT_IAM_TEST"] = error
              else:
                  report["ARTIFACT_DOWNLOAD"] = (
                      "YES" if "artifactregistry.repositories.downloadArtifacts"
                      in granted.get("permissions", []) else "NO")

              granted, error = api("https://iam.googleapis.com/v1/projects/" + project
                                   + "/serviceAccounts/" + runtime + ":testIamPermissions",
                                   token, ["iam.serviceAccounts.actAs"])
              if error:
                  report["ERRORS"]["RUNTIME_IAM_TEST"] = error
              else:
                  report["ACT_AS_RUNTIME"] = (
                      "YES" if "iam.serviceAccounts.actAs" in granted.get("permissions", [])
                      else "NO")

              manifest = Path(os.environ["RUNNER_TEMP"]) / "kc05-service.json"
              render = run([sys.executable, "approved-source/scripts/ci/keycloak_dev.py",
                            "render", "--hostname",
                            "https://visana-keycloak-dev-984938781030.us-central1.run.app",
                            "--image", "us-central1-docker.pkg.dev/visana-erp-dev/visana-repo/"
                            "visana-keycloak-dev@sha256:00462375f745a2f05afbc22b337fab23ae7a757846581edbab8f9afc14819b95",
                            "--output", str(manifest)])
              if render.returncode or not manifest.is_file():
                  raise RuntimeError("MANIFEST_RENDER_FAILED")
              dry = run(["gcloud", "run", "services", "replace", str(manifest),
                         "--dry-run", "--project=" + project, "--region=us-central1",
                         "--quiet"])
              report["DRY_RUN_RESULT"] = "PASS" if dry.returncode == 0 else "FAIL"
              if dry.returncode:
                  report["ERRORS"]["DRY_RUN"] = safe_error(dry.stderr or dry.stdout)
              report["KC05_UNBLOCKED"] = "YES" if dry.returncode == 0 else "NO"
          except (RuntimeError, OSError, subprocess.TimeoutExpired, ValueError) as exc:
              report["ERRORS"]["CHECK"] = (str(exc) if isinstance(exc, RuntimeError)
                                             else type(exc).__name__)
          finally:
              target = Path(os.environ["RUNNER_TEMP"]) / "kc05-unblock-result.json"
              target.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              print("KC05_UNBLOCK_CHECK_COMPLETE")
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kc05-unblock-result
          path: ${{ runner.temp }}/kc05-unblock-result.json
          if-no-files-found: error
          retention-days: 14
