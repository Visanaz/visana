name: KC05_PRIVATE_RETRY_ONLY

on:
  push:
    branches: [ops/keycloak-dev-foundation]
    paths:
      - .github/workflows/keycloak-dev-kc05-retry.yml
      - .github/scripts/kc05_retry_runner.py

permissions:
  contents: read

concurrency:
  group: keycloak-dev-kc05-retry
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Visanaz/visana' &&
      github.ref == 'refs/heads/ops/keycloak-dev-foundation' &&
      github.actor == 'KmDRF' &&
      github.triggering_actor == 'KmDRF'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verify PR before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import subprocess
          def api(path):
              process = subprocess.run(["gh", "api", path], capture_output=True,
                                       text=True, check=False)
              if process.returncode:
                  raise SystemExit("GITHUB_PREFLIGHT_UNAVAILABLE")
              return json.loads(process.stdout)
          permission = api("repos/Visanaz/visana/collaborators/KmDRF/permission")
          if permission.get("permission") not in ("write", "maintain", "admin"):
              raise SystemExit("ACTOR_PERMISSION_MISMATCH")
          pr = api("repos/Visanaz/visana/pulls/20")
          if not (pr.get("state") == "open" and pr.get("draft") is True
                  and pr.get("merged_at") is None and pr["base"]["ref"] == "dev"
                  and pr["head"]["sha"] == "8701fc5b377af72665dce210203e43c0433a1fbd"):
              raise SystemExit("PR_PREFLIGHT_MISMATCH")
          print("PR_PREFLIGHT=PASS")

      - name: Checkout isolated workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact certified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8701fc5b377af72665dce210203e43c0433a1fbd
          path: approved-source
          persist-credentials: false

      - name: Verify certified source SHA
        shell: python
        run: |
          import subprocess
          head = subprocess.check_output(
              ["git", "-C", "approved-source", "rev-parse", "HEAD"],
              text=True).strip()
          if head != "8701fc5b377af72665dce210203e43c0433a1fbd":
              raise SystemExit("SOURCE_SHA_MISMATCH")
          print("SOURCE_SHA=PASS")

      - name: Authenticate exact DEV deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: visana-erp-dev

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Guarded preflight, one deploy, sanitized postcheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/kc05_retry_runner.py

      - name: Upload sanitized KC-05 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kc05-deploy-result
          path: ${{ runner.temp }}/kc05-deploy-result.json
          if-no-files-found: warn
          retention-days: 14
