name: KC00_DIAGNOSTIC_ONLY

on:
  push:
    branches:
      - ops/keycloak-dev-foundation

permissions:
  contents: read

concurrency:
  group: keycloak-dev-foundation
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'Visanaz/visana' && github.ref == 'refs/heads/ops/keycloak-dev-foundation' && github.actor == 'KmDRF' && github.triggering_actor == 'KmDRF'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Verify actor permission and reference PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, subprocess
          def api(path):
              p = subprocess.run(['gh', 'api', path], capture_output=True, text=True)
              if p.returncode:
                  raise SystemExit('GITHUB_METADATA_CHECK_FAILED; no cloud authentication attempted')
              return json.loads(p.stdout)
          assert api('repos/Visanaz/visana/collaborators/KmDRF/permission')['permission'] in ['write','maintain','admin']
          pr = api('repos/Visanaz/visana/pulls/20')
          assert pr['state'] == 'open' and pr['draft'] and not pr['merged']
          assert pr['base']['ref'] == 'dev'
          assert pr['head']['sha'] == '259727ae56487ff575a0781c6bac0814ccb64d31'
          print('ACTOR_AND_PR_PREFLIGHT=PASS')

      - name: Checkout approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 259727ae56487ff575a0781c6bac0814ccb64d31
          path: approved-source
          persist-credentials: false

      - name: Verify source integrity
        shell: python
        run: |
          import subprocess
          expected = {
            'infra/keycloak/Dockerfile': 'f93351e5604205160329935b5bcc0bd03f1652e9',
            'infra/keycloak/keycloak.conf': '608541333f0af59b0202838535c1c3b71e60e3e0',
            'infra/keycloak/visana-erp-realm.json': '452a1a2a0529a93b2cc0ce2ce08b739be42866f9',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git','-C','approved-source','hash-object',path],text=True).strip()
              assert actual == blob, 'SOURCE_INTEGRITY_FAILED'
          print('SOURCE_INTEGRITY=PASS')

      - name: Diagnose base built and source without cloud authentication
        shell: python
        run: |
          import datetime
          import hashlib
          import gzip
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import urllib.request
          
          SOURCE = '259727ae56487ff575a0781c6bac0814ccb64d31'
          BASE = 'quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54'
          BUILT = 'kc00-diagnostic:' + SOURCE
          summary = []
          out = {
              'SOURCE_SHA': SOURCE, 'BASE_IMAGE_DIGEST': BASE.split('@')[1],
              'BASE_IMAGE_ID': None, 'BUILT_IMAGE_ID': None, 'PLATFORM': 'linux/amd64',
              'GITLEAKS_VERSION': '8.30.1',
              'BASE_SCAN_CLASS': 'NOT_EXECUTED', 'BASE_GITLEAKS_EXIT_CODE': None, 'BASE_FINDING_COUNT': None,
              'BUILT_SCAN_CLASS': 'NOT_EXECUTED', 'BUILT_GITLEAKS_EXIT_CODE': None, 'BUILT_FINDING_COUNT': None,
              'SOURCE_SCAN_CLASS': 'NOT_EXECUTED', 'SOURCE_GITLEAKS_EXIT_CODE': None, 'SOURCE_FINDING_COUNT': None,
              'INHERITED_FINDING_COUNT': None, 'NEW_FINDING_COUNT': None, 'sanitizedFindings': [],
              'TRIVY_VERSION': '0.74.0', 'TRIVY_EXIT_CODE': None, 'TRIVY_SECRET_COUNT': None,
              'TRIVY_HIGH_COUNT': None, 'TRIVY_CRITICAL_COUNT': None, 'TRIVY_VULNERABILITIES': [],
          }
          stage = 'INITIALIZATION'
          
          
          def record(name, value):
              # Called exclusively with static labels, counts, booleans, image IDs or digests.
              summary.append(name + ' = ' + json.dumps(value, ensure_ascii=True))
          
          
          def command(args, timeout=180):
              result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError('CONTROLLED_COMMAND_FAILED')
              return result.stdout
          
          
          def download_binary(root, name, url, checksum):
              archive = root / (name + '.tar.gz')
              urllib.request.urlretrieve(url, archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == checksum
              with tarfile.open(archive) as tf:
                  member = next(x for x in tf.getmembers() if x.name.removeprefix('./') == name and x.isfile())
                  path = root / name
                  path.write_bytes(tf.extractfile(member).read())
                  path.chmod(0o700)
              return str(path)
          
          
          def export_unique_layers(ref, inspect, root, label):
              # image.tar is outside the scan directory and is never a scanner input.
              archive = root / (label + '-transport.tar')
              destination = root / label
              destination.mkdir()
              layers_dir = destination / 'layers'
              layers_dir.mkdir()
              command(['docker', 'image', 'save', '--output', str(archive), ref])
              with tarfile.open(archive) as tf:
                  manifests = json.load(tf.extractfile('manifest.json'))
                  assert len(manifests) == 1
                  layers = manifests[0]['Layers']
                  digests = inspect['RootFS']['Layers']
                  assert len(layers) == len(digests) and len(set(digests)) == len(digests)
                  for member_name, digest in zip(layers, digests):
                      assert re.fullmatch('sha256:[0-9a-f]{64}', digest)
                      layer_path = layers_dir / (digest.replace(':', '-') + '.tar')
                      with tf.extractfile(member_name) as source, layer_path.open('wb') as target:
                          magic = source.read(2)
                          source.seek(0)
                          if magic == b'\x1f\x8b':
                              with gzip.GzipFile(fileobj=source) as decoded:
                                  shutil.copyfileobj(decoded, target)
                          else:
                              shutil.copyfileobj(source, target)
                      # Docker save emits uncompressed layer archives; verify actual bytes against DiffID.
                      h = hashlib.sha256()
                      with layer_path.open('rb') as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                              h.update(chunk)
                      assert 'sha256:' + h.hexdigest() == digest
              archive.unlink()
              (destination / 'config.json').write_text(json.dumps(inspect['Config'], indent=2))
              history = command(['docker', 'history', '--no-trunc', '--format', '{{json .}}', ref])
              (destination / 'history.jsonl').write_text(history)
              return destination
          
          
          def scan_gitleaks(binary, target, label, root, base_digests, report_path='-'):
              # '-' is the supported Gitleaks stdout reporter; never print captured streams.
              args = [binary, 'dir', str(target), '--max-archive-depth=3', '--redact=100',
                      '--report-format=json', '--report-path=' + report_path, '--no-banner', '--log-level=error']
              timed_out = False
              try:
                  proc = subprocess.run(args, capture_output=True, timeout=900, cwd=root)
                  code, stdout, stderr = proc.returncode, proc.stdout, proc.stderr
              except subprocess.TimeoutExpired as exc:
                  code, stdout, stderr = None, exc.stdout or b'', exc.stderr or b''
                  timed_out = True
              # Raw JSON exists only in a temporary location and is parsed from memory.
              raw = root / (label + '-ephemeral-report.json')
              raw.write_bytes(stdout)
              try:
                  parsed = json.loads(stdout)
                  valid = isinstance(parsed, list) and all(isinstance(x, dict) and
                          all(k in x for k in ['RuleID', 'File', 'StartLine', 'EndLine']) for x in parsed)
              except (ValueError, UnicodeDecodeError):
                  parsed, valid = [], False
              finally:
                  raw.unlink(missing_ok=True)
              record(label + '_GITLEAKS_EXIT_CODE', code)
              record(label + '_STDOUT_JSON_VALID', valid)
              record(label + '_STDERR_PRESENT', bool(stderr))
              record(label + '_STDERR_SHA256', hashlib.sha256(stderr).hexdigest())
              record(label + '_TIMEOUT', timed_out)
              # Static error marker from the verified scanner source, not raw stderr/context.
              record(label + '_REPORT_PATH_NOT_WRITABLE', b'Report path is not writable' in stderr)
              findings = {}
              if valid:
                  for item in parsed:
                      file_path = str(item['File']).replace('\\', '/')
                      prefix = str(target).replace('\\', '/').rstrip('/') + '/'
                      if file_path.startswith(prefix):
                          relative = file_path[len(prefix):]
                      elif not file_path.startswith('/') and '..' not in file_path.split('/'):
                          relative = file_path.removeprefix('./')
                      else:
                          relative = 'UNRESOLVED_PATH'
                      # Preserve public file/layer paths, never Secret/Match/SymlinkFile/context.
                      normalized = label.lower() + '/' + re.sub(r'[\x00-\x1f\x7f]', '_', relative)
                      origin = 'UNKNOWN'
                      layer = re.search(r'(?:^|/)layers/sha256-([0-9a-f]{64})\.tar', relative)
                      if layer:
                          origin = 'INHERITED_BASE' if 'sha256:' + layer.group(1) in base_digests else 'VISANA_LAYER'
                      elif relative == 'config.json':
                          origin = 'CONFIG'
                      elif relative == 'history.jsonl':
                          origin = 'HISTORY'
                      rule = str(item['RuleID'])
                      assert re.fullmatch(r'[A-Za-z0-9_.-]+', rule)
                      start, end = int(item['StartLine']), int(item['EndLine'])
                      fingerprint = hashlib.sha256((rule + normalized + str(start) + str(end)).encode()).hexdigest()
                      findings[fingerprint] = {'ruleId': rule, 'path': normalized, 'startLine': start,
                                               'endLine': end, 'fingerprint': fingerprint, 'origin': origin}
              classification = ('SCANNER_ERROR' if timed_out else
                                'FINDINGS' if valid and findings else
                                'CLEAN' if code == 0 and valid and not findings else 'SCANNER_ERROR')
              record(label + '_FINDING_COUNT', len(findings) if valid else None)
              record(label + '_SCAN_CLASS', classification)
              del stdout, stderr, parsed
              return classification, code, list(findings.values()), valid
          
          
          def validate_artifact(value):
              forbidden = {'secret', 'match', 'password', 'token', 'private_key', 'credentials', 'authorization'}
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key == 'TRIVY_SECRET_COUNT' or not any(word in key.lower() for word in forbidden)
                      validate_artifact(child)
              elif isinstance(value, list):
                  for child in value:
                      validate_artifact(child)
          
          
          try:
              stage = 'SOURCE'
              context = Path('approved-source/infra/keycloak').resolve()
              expected = {'Dockerfile': 'f93351e5604205160329935b5bcc0bd03f1652e9',
                          'keycloak.conf': '608541333f0af59b0202838535c1c3b71e60e3e0',
                          'visana-erp-realm.json': '452a1a2a0529a93b2cc0ce2ce08b739be42866f9'}
              for name, blob in expected.items():
                  assert command(['git', '-C', 'approved-source', 'hash-object', 'infra/keycloak/' + name]).strip() == blob
              dockerfile = (context / 'Dockerfile').read_text()
              assert [x.split()[1] for x in dockerfile.splitlines() if x.startswith('FROM ')] == [BASE, BASE]
              assert not any(x.strip().upper().startswith(('ARG ', 'ADD ')) for x in dockerfile.splitlines())
              assert (context / '.dockerignore').read_text().splitlines() == ['**', '!Dockerfile', '!keycloak.conf', '!visana-erp-realm.json']
              stage = 'BUILD'
              command(['docker', 'pull', '--platform=linux/amd64', BASE], 600)
              command(['docker', 'build', '--platform=linux/amd64', '--pull',
                       '--label', 'org.opencontainers.image.revision=' + SOURCE,
                       '--label', 'org.opencontainers.image.source=https://github.com/Visanaz/visana',
                       '--tag', BUILT, '--file', str(context / 'Dockerfile'), str(context)], 900)
              base = json.loads(command(['docker', 'image', 'inspect', BASE]))[0]
              built = json.loads(command(['docker', 'image', 'inspect', BUILT]))[0]
              for image in [base, built]:
                  assert image['Os'] == 'linux' and image['Architecture'] == 'amd64'
                  assert not any(re.search(r'(PASSWORD|TOKEN|PRIVATE_KEY|CREDENTIALS|CLIENT_SECRET)', x.split('=', 1)[0], re.I)
                                 for x in image['Config'].get('Env', []))
              out['BASE_IMAGE_ID'], out['BUILT_IMAGE_ID'] = base['Id'], built['Id']
              base_layers = set(base['RootFS']['Layers'])
              record('BASE_LAYER_DIGESTS', base['RootFS']['Layers'])
              record('BUILT_LAYER_DIGESTS', built['RootFS']['Layers'])
              record('INHERITED_LAYERS', [x for x in built['RootFS']['Layers'] if x in base_layers])
              record('VISANA_ADDED_OR_CHANGED_LAYERS', [x for x in built['RootFS']['Layers'] if x not in base_layers])
              record('PRIOR_LOCAL_IMAGE_ID_MATCH', built['Id'] == 'sha256:6b019560bc9b3fb3dde7824fe22ea82d7ba57fd498311c41e150f76c40927b34')
              with tempfile.TemporaryDirectory(prefix='kc00d-', dir=os.environ['RUNNER_TEMP']) as temp:
                  root = Path(temp)
                  stage = 'VERIFIED_SCANNERS'
                  gl = download_binary(root, 'gitleaks', 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz', '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb')
                  trivy = download_binary(root, 'trivy', 'https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz', '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a')
                  # Nonsecret empty-directory control isolates the former reporter path behavior.
                  control = root / 'empty-control'
                  control.mkdir()
                  stage = 'LEGACY_REPORTER_CONTROL'
                  scan_gitleaks(gl, control, 'LEGACY_REPORTER_CONTROL', root, base_layers, '/dev/stdout')
                  stage = 'UNIQUE_LAYER_EXPORT'
                  base_dir = export_unique_layers(BASE, base, root, 'base')
                  built_dir = export_unique_layers(BUILT, built, root, 'built')
                  source_dir = root / 'source'
                  source_dir.mkdir()
                  for name in expected:
                      shutil.copyfile(context / name, source_dir / name)
                  all_findings = {}
                  for label, target in [('BASE', base_dir), ('BUILT', built_dir), ('SOURCE', source_dir)]:
                      stage = 'GITLEAKS_' + label
                      cls, exit_code, findings, valid = scan_gitleaks(gl, target, label, root, base_layers)
                      out[label + '_SCAN_CLASS'] = cls
                      out[label + '_GITLEAKS_EXIT_CODE'] = exit_code
                      out[label + '_FINDING_COUNT'] = len(findings) if valid else None
                      all_findings[label] = findings
                      out['sanitizedFindings'].extend(findings)
                  def equivalent(f):
                      # Metadata equivalence only: no secret values or hashes enter this key.
                      return (f['ruleId'], f['path'].split('/', 1)[1], f['startLine'], f['endLine'])
                  if out['BASE_SCAN_CLASS'] != 'SCANNER_ERROR' and out['BUILT_SCAN_CLASS'] != 'SCANNER_ERROR':
                      base_keys = {equivalent(x) for x in all_findings['BASE']}
                      built_keys = {equivalent(x) for x in all_findings['BUILT']}
                      out['INHERITED_FINDING_COUNT'] = len(base_keys & built_keys)
                      out['NEW_FINDING_COUNT'] = len(built_keys - base_keys)
                  stage = 'TRIVY'
                  try:
                      tr = subprocess.run([trivy, 'image', '--scanners', 'vuln,secret', '--severity', 'HIGH,CRITICAL',
                                           '--format', 'json', '--quiet', '--exit-code', '1', '--timeout', '10m', BUILT],
                                          capture_output=True, timeout=660)
                      out['TRIVY_EXIT_CODE'] = tr.returncode
                      record('TRIVY_STDERR_PRESENT', bool(tr.stderr))
                      record('TRIVY_STDERR_SHA256', hashlib.sha256(tr.stderr).hexdigest())
                      tr_data = json.loads(tr.stdout)
                      assert isinstance(tr_data, dict) and 'Results' in tr_data
                      record('TRIVY_STDOUT_JSON_VALID', True)
                      out['TRIVY_SECRET_COUNT'] = sum(len(x.get('Secrets', [])) for x in tr_data['Results'])
                      vulnerabilities = [v for result in tr_data['Results'] for v in result.get('Vulnerabilities', [])]
                      out['TRIVY_HIGH_COUNT'] = sum(v.get('Severity') == 'HIGH' for v in vulnerabilities)
                      out['TRIVY_CRITICAL_COUNT'] = sum(v.get('Severity') == 'CRITICAL' for v in vulnerabilities)
                      out['TRIVY_VULNERABILITIES'] = [{'id': v.get('VulnerabilityID'), 'package': v.get('PkgName'),
                                                    'installedVersion': v.get('InstalledVersion'), 'fixedVersion': v.get('FixedVersion'),
                                                    'severity': v.get('Severity')} for v in vulnerabilities]
                      del tr_data, tr
                  except (subprocess.TimeoutExpired, ValueError, AssertionError):
                      record('TRIVY_CLASS', 'SCANNER_ERROR')
                  stage = 'SANITIZED_REPORT'
          except Exception as error:
              record('DIAGNOSTIC_ERROR_STAGE', stage)
              record('DIAGNOSTIC_ERROR_TYPE', type(error).__name__)
          finally:
              record('LAST_STAGE', stage)
              record('CLOUD_AUTHENTICATION', False)
              record('REGISTRY_PUSH_ATTEMPTED', False)
              validate_artifact(out)
              Path('kc00-scan-diagnostic.json').write_text(json.dumps(out, indent=2) + '\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
                  target.write('# KC00_DIAGNOSTIC_ONLY\n\n```text\n' + '\n'.join(summary) + '\n```\n')
              for line in summary:
                  print(line)
              print('SANITIZED_ARTIFACT_VALIDATED=kc00-scan-diagnostic.json')
          
          if any(out[x + '_SCAN_CLASS'] in ['SCANNER_ERROR', 'NOT_EXECUTED'] for x in ['BASE', 'BUILT', 'SOURCE']) or out['TRIVY_SECRET_COUNT'] is None:
              raise SystemExit(1)

      - name: Retain only the validated diagnostic JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kc00-scan-diagnostic
          path: kc00-scan-diagnostic.json
          if-no-files-found: error
          retention-days: 7
