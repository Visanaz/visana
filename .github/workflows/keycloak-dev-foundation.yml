name: KC00E_FINALIZE_ASSESSMENT_ONLY

on:
  push:
    branches:
      - ops/keycloak-dev-foundation

permissions:
  contents: read
  actions: read

concurrency:
  group: keycloak-dev-foundation
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'Visanaz/visana' && github.ref == 'refs/heads/ops/keycloak-dev-foundation' && github.actor == 'KmDRF' && github.triggering_actor == 'KmDRF' && false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify actor permission and reference PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, subprocess
          def api(path):
              p = subprocess.run(['gh', 'api', path], capture_output=True, text=True)
              if p.returncode:
                  raise SystemExit('GITHUB_METADATA_CHECK_FAILED; no cloud authentication attempted')
              return json.loads(p.stdout)
          assert api('repos/Visanaz/visana/collaborators/KmDRF/permission')['permission'] in ['write','maintain','admin']
          pr = api('repos/Visanaz/visana/pulls/20')
          assert pr['state'] == 'open' and pr['draft'] and not pr['merged']
          assert pr['base']['ref'] == 'dev'
          assert pr['head']['sha'] == '259727ae56487ff575a0781c6bac0814ccb64d31'
          print('ACTOR_AND_PR_PREFLIGHT=PASS')

      - name: Reconcile official evidence into existing sanitized assessment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import Path
          p = subprocess.run(['gh','api','repos/Visanaz/visana/actions/artifacts/11117918553/zip'], capture_output=True)
          assert p.returncode == 0, 'ARTIFACT_DOWNLOAD_FAILED'
          with zipfile.ZipFile(io.BytesIO(p.stdout)) as archive:
              assert archive.namelist() == ['kc00e-keycloak-2674-assessment.json']
              raw = archive.read(archive.namelist()[0])
          assert hashlib.sha256(raw).hexdigest() == '661dee5b2380c7dc2f0001483c37ccd736cc677b8b901c340337a8b8619e8ca5'
          data = json.loads(raw)
          updates = json.loads('{"OFFICIAL_RELEASE_REVIEW": {"latestObservedRelease": "26.7.5", "publishedAtUtc": "2026-09-30T17:44:19Z", "observedAt": "2026-09-30", "sources": ["https://github.com/keycloak/keycloak/releases/tag/26.7.5", "https://github.com/keycloak/keycloak/issues/52888"], "correction": "The downloads page still displayed 26.7.4; live official GitHub release metadata establishes 26.7.5. Supersedes initial runner release note only; scan and compatibility measurements unchanged.", "documentedFixInNewRelease": ["CVE-2026-84939"], "safeOfficialPathForRemainingCriticals": "NOT_VALIDATED", "nextCandidate": "26.7.5; requires separate authorization and complete image assessment", "newReleaseBuiltOrScanned": false, "rebuiltImage": "26.7.4 resolved to the same Quay digest before and after the run; no alternative digest or safe rebuilt image evidenced. Historical tag changes not established.", "officialMitigationApplied": false, "officialMitigationReview": "No verified Keycloak 26.7.4 mitigation closing all remaining CRITICAL findings. Dependency-level fixes are recorded by Trivy; no package surgery performed."}, "ASSESSMENT_PROVENANCE": {"measurementRun": 36759086953, "measurementWorkflowSha": "8530a091e92152884f5aa1ab35598bc0f61c824a", "measurementArtifactId": 11117918553, "measurementJsonSha256": "661dee5b2380c7dc2f0001483c37ccd736cc677b8b901c340337a8b8619e8ca5", "baselineRun": 36754205026, "finalization": "Reconcile official release evidence and direct crypto dependency classification only. No repeated scans, builds or tests."}, "ASSESSMENT_LIMITS": ["Gitleaks base and built returned valid finding JSON and nonempty error-level stderr; only metadata retained. No claim of exhaustive error-free scanner coverage.", "Source Gitleaks scope is the three approved image input files, same as KC-00D; not a full repository history scan.", "Comparison uses historical 26.7.3 baseline and present 26.7.4 results; no same-time rescan of 26.7.3.", "Vulnerability presence and dependency classification do not prove exploitability.", "Isolated compatibility evidence does not establish cloud operation or close the IDP gate."], "GITLEAKS_FINDING_CLASSIFICATION": "KNOWN_INHERITED_BASE_FINDING", "GITLEAKS_BASELINE_CORRELATION": "Same rule, internal java.security path and line 1035 as 26.7.3; layer DiffID differs. Metadata correlation only; no comparison of secret values.", "PROPOSED_DOCKERFILE_CHANGE_STATUS": "NOT_RECOMMENDED; proposal only, not applied", "DECISION_REASON": "Build and compatibility pass, but none of the eight baseline CVEs is removed: HIGH 9 and CRITICAL 4 unchanged. Required material security improvement absent.", "CRITICAL_CLASSIFICATIONS": [{"CVE": "CVE-2026-75595", "package": "io.netty:netty-handler", "installedVersion": "4.1.136.Final", "fixedVersion": "4.2.17.Final, 4.1.137.Final", "severity": "CRITICAL", "classification": "TRANSITIVE_RUNTIME", "classificationEvidence": ["https://github.com/keycloak/keycloak/blob/26.7.4/quarkus/runtime/pom.xml", "https://github.com/netty/netty/security/advisories/GHSA-c4c3-7fpv-j4q5"], "basis": "Bundled networking runtime through Quarkus/Vert.x; affected TLS SNI execution path not demonstrated by presence.", "severityNote": "Trivy classifies CRITICAL; Netty advisory labels HIGH. Preserve scanner severity for the established gate."}, {"CVE": "CVE-2026-8763", "package": "org.bouncycastle:bcprov-jdk18on", "installedVersion": "1.84", "fixedVersion": "1.85", "severity": "CRITICAL", "classification": "DIRECT_KEYCLOAK_RUNTIME", "classificationEvidence": ["https://github.com/keycloak/keycloak/blob/26.7.4/crypto/default/pom.xml", "https://github.com/keycloak/keycloak/blob/26.7.4/crypto/default/src/main/java/org/keycloak/crypto/def/DefaultCryptoProvider.java"], "basis": "Default crypto module declares bcprov and directly instantiates BouncyCastleProvider; initial generic transitive label refined from official source."}, {"CVE": "CVE-2026-8763", "package": "org.bouncycastle:bcprov-jdk18on", "installedVersion": "1.84", "fixedVersion": "1.85", "severity": "CRITICAL", "classification": "DIRECT_KEYCLOAK_RUNTIME", "classificationEvidence": ["https://github.com/keycloak/keycloak/blob/26.7.4/crypto/default/pom.xml", "https://github.com/keycloak/keycloak/blob/26.7.4/crypto/default/src/main/java/org/keycloak/crypto/def/DefaultCryptoProvider.java"], "basis": "Default crypto module declares bcprov and directly instantiates BouncyCastleProvider; initial generic transitive label refined from official source."}, {"CVE": "CVE-2026-84939", "package": "org.freemarker:freemarker", "installedVersion": "2.3.32", "fixedVersion": "2.3.35", "severity": "CRITICAL", "classification": "DIRECT_KEYCLOAK_RUNTIME", "classificationEvidence": ["https://github.com/keycloak/keycloak/blob/26.7.4/services/src/main/java/org/keycloak/theme/freemarker/DefaultFreeMarkerProvider.java"], "basis": "Default theme provider directly loads and processes FreeMarker templates."}]}')
          before = dict(data)
          data.update(updates)
          assert all(data[k] == v for k,v in before.items() if k not in updates)
          def validate(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key == 'SECRET_COUNT' or not any(s in key.lower() for s in ('secret', 'password', 'token', 'match', 'credentials', 'private_key', 'authorization'))
                      validate(child)
              elif isinstance(value, list):
                  for child in value:
                      validate(child)
          validate(data)
          result = (json.dumps(data, indent=2) + '\n').encode()
          assert hashlib.sha256(result).hexdigest() == '9e517df70ea80622673cbfd142b24ae4700bc34e8f97710423b4f5f3073abb3b'
          Path('kc00e-keycloak-2674-assessment.json').write_bytes(result)
          print('SANITIZED_ASSESSMENT_FINALIZED; measurement fields unchanged; no build, scan or test repeated')

      - name: Upload sanitized assessment only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kc00e-keycloak-2674-assessment
          path: kc00e-keycloak-2674-assessment.json
          if-no-files-found: error
          retention-days: 14
