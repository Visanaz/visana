name: KC00R2_READONLY_REMOTE_POSTCHECK

on:
  push:
    branches:
      - ops/keycloak-dev-foundation

permissions:
  contents: read

jobs:
  postcheck:
    if: >-
      github.repository == 'Visanaz/visana' &&
      github.ref == 'refs/heads/ops/keycloak-dev-foundation' &&
      github.actor == 'KmDRF' &&
      github.triggering_actor == 'KmDRF'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authenticate exact DEV deployer identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: visana-erp-dev
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Verify remote image and cloud inventory read only
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          TAG = 'us-central1-docker.pkg.dev/visana-erp-dev/visana-repo/visana-keycloak-dev:8701fc5b377af72665dce210203e43c0433a1fbd'
          DIGEST = 'sha256:00462375f745a2f05afbc22b337fab23ae7a757846581edbab8f9afc14819b95'
          CANONICAL = 'us-central1-docker.pkg.dev/visana-erp-dev/visana-repo/visana-keycloak-dev@sha256:00462375f745a2f05afbc22b337fab23ae7a757846581edbab8f9afc14819b95'
          IMAGE_ID = 'sha256:14d4fd1f19f78e4cccca0e100646cd8bc6b0c7f1b379b47a1f9879ff7c903b34'
          LAYERS = ['sha256:4d434782b05d2c6b48da5a3af9f5d9435a9fe176bdbc53aec09a58656441f7e4', 'sha256:1dde54818391066dc754422bdf713e4c07e3ddf08ea17602604f67daedc2bf1f', 'sha256:caed84faf81cbf1ac7cdfe03982188d32beda5346482ed7f6ebd9ccd5f9c6646', 'sha256:14b16d26f7a8b53b3c3f5d23a3ee45945617fe0ea75c22ef21358e79a9ee3aac', 'sha256:3a69d67b7b430bbb1bb1ce1098b6475aca860c1ab094c8713bcedb4068364dad', 'sha256:5edf4ff93e3300b60676d54653b2408f6719bc4ebd6523713a2885fc76c95102', 'sha256:ffedadcfb1bcf2b605dab586d93dcd375662a392e62f65b47a9519f31dcc8046']
          OUT = Path(os.environ["RUNNER_TEMP"]) / "kc00r2-remote-postcheck.json"
          report = {"READ_ONLY": True, "PUSH_EXECUTED": False, "TAG": TAG, "EXPECTED_DIGEST": DIGEST,
                    "REGISTRY_DESCRIBE": "NOT_RUN", "REGISTRY_MANIFEST": "NOT_RUN",
                    "REMOTE_INTEGRITY": "NOT_RUN", "CLOUD_RUN_EXISTS": None,
                    "DB_EXISTS": "UNKNOWN", "DB_USER_EXISTS": "UNKNOWN",
                    "RUNTIME_SA_EXISTS": "UNKNOWN", "KEYCLOAK_SECRETS_EXIST": "UNKNOWN",
                    "POSTCHECK": "INCOMPLETE", "FAILED_STAGE": None}
          stage = "INIT"

          def command(args, timeout=120):
              p = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                 timeout=timeout, check=False)
              if p.returncode:
                  raise RuntimeError("READ_ONLY_COMMAND_FAILED")
              return p.stdout.decode(errors="replace")

          def probe(args, predicate):
              try:
                  data = json.loads(command(args))
                  return bool(predicate(data))
              except Exception:
                  return "UNKNOWN"

          try:
              stage = "IDENTITY"
              account = command(["gcloud", "auth", "list", "--filter=status:ACTIVE", "--format=value(account)"]).strip()
              project = command(["gcloud", "config", "get-value", "project"]).strip()
              assert account == "github-actions-dev@visana-erp-dev.iam.gserviceaccount.com" and project == "visana-erp-dev"
              report["ACTIVE_GCP_IDENTITY"] = account
              stage = "REGISTRY_DESCRIBE"
              described = json.loads(command(["gcloud", "artifacts", "docker", "images", "describe", TAG, "--format=json"]))
              assert isinstance(described, dict) and described
              report["REGISTRY_DESCRIBE"] = "PASS"
              report["PACKAGE_EXISTS"] = probe(["gcloud", "artifacts", "packages", "describe", "visana-keycloak-dev",
                                                "--repository=visana-repo", "--location=us-central1",
                                                "--project=visana-erp-dev", "--format=json"], lambda d: bool(d))
              stage = "REGISTRY_MANIFEST"
              token = command(["gcloud", "auth", "print-access-token"]).strip()
              assert token
              login = subprocess.run(["docker", "login", "-u", "oauth2accesstoken", "--password-stdin",
                                      "us-central1-docker.pkg.dev"], input=(token + "\n").encode(),
                                     stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              del token
              assert login.returncode == 0
              manifest = command(["docker", "buildx", "imagetools", "inspect", TAG], timeout=180)
              assert re.search(r"^Digest:\s*" + re.escape(DIGEST) + r"\s*$", manifest, re.M)
              report["REGISTRY_MANIFEST"] = "PASS"
              report["TAG_EXISTS"] = True
              stage = "REMOTE_INTEGRITY"
              command(["docker", "pull", "--platform=linux/amd64", CANONICAL], timeout=900)
              images = json.loads(command(["docker", "image", "inspect", CANONICAL]))
              assert len(images) == 1
              image = images[0]
              assert image["Os"] == "linux" and image["Architecture"] == "amd64"
              assert image["Id"] == IMAGE_ID and image["RootFS"]["Layers"] == LAYERS
              labels = image["Config"].get("Labels") or {}
              assert labels.get("org.opencontainers.image.revision") == "8701fc5b377af72665dce210203e43c0433a1fbd"
              assert labels.get("org.opencontainers.image.source") == "https://github.com/Visanaz/visana"
              assert CANONICAL in image.get("RepoDigests", [])
              report["REMOTE_INTEGRITY"] = "PASS"
              report["REMOTE_IMAGE_ID"] = image["Id"]
              stage = "CLOUD_INVENTORY"
              services = json.loads(command(["gcloud", "run", "services", "list", "--region=us-central1",
                                             "--project=visana-erp-dev", "--format=json"]))
              assert isinstance(services, list)
              report["CLOUD_RUN_EXISTS"] = any(x.get("metadata", {}).get("name") == "visana-keycloak-dev" or
                                                x.get("name", "").endswith("/services/visana-keycloak-dev") for x in services)
              assert report["CLOUD_RUN_EXISTS"] is False
              report["DB_EXISTS"] = probe(["gcloud", "sql", "databases", "list", "--instance=visana-db-dev",
                                           "--project=visana-erp-dev", "--format=json"],
                                          lambda d: any(x.get("name") == "keycloak_dev" for x in d))
              report["DB_USER_EXISTS"] = probe(["gcloud", "sql", "users", "list", "--instance=visana-db-dev",
                                                "--project=visana-erp-dev", "--format=json"],
                                               lambda d: any(x.get("name") == "keycloak_app_dev" for x in d))
              report["RUNTIME_SA_EXISTS"] = probe(["gcloud", "iam", "service-accounts", "list",
                                                   "--project=visana-erp-dev", "--format=json"],
                                                  lambda d: any(x.get("email") == "visana-keycloak-dev@visana-erp-dev.iam.gserviceaccount.com" for x in d))
              report["KEYCLOAK_SECRETS_EXIST"] = probe(["gcloud", "secrets", "list", "--project=visana-erp-dev",
                                                         "--format=json"],
                                                        lambda d: any(any(name in x.get("name", "") for name in
                                                            ["visana-dev-keycloak-db-password", "visana-dev-keycloak-bootstrap-password",
                                                             "visana-dev-keycloak-health-client-secret"]) for x in d))
              report["POSTCHECK"] = "PASS" if all(report[k] is False for k in
                  ["CLOUD_RUN_EXISTS", "DB_EXISTS", "DB_USER_EXISTS", "RUNTIME_SA_EXISTS", "KEYCLOAK_SECRETS_EXIST"]) else "PARTIAL"
          except Exception as exc:
              report["FAILED_STAGE"] = stage
              report["ERROR_TYPE"] = type(exc).__name__
              report["POSTCHECK"] = "FAIL"
          finally:
              OUT.write_text(json.dumps(report, indent=2) + "\n")
              print("POSTCHECK=" + report["POSTCHECK"])
              print("FAILED_STAGE=" + str(report["FAILED_STAGE"]))
          if report["POSTCHECK"] == "FAIL":
              raise SystemExit(1)

      - name: Upload sanitized read-only postcheck
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kc00r2-remote-postcheck
          path: ${{ runner.temp }}/kc00r2-remote-postcheck.json
          if-no-files-found: ignore
          retention-days: 14
