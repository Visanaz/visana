name: sql-proof-diagnostic

on:
  push:
    branches:
      - ops/sql-proof-diagnostic

permissions:
  contents: read

jobs:
  validate-candidate:
    if: >-
      github.repository == 'Visanaz/visana' &&
      github.ref == 'refs/heads/ops/sql-proof-diagnostic' &&
      github.actor == 'KmDRF'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate and unchanged SQL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/ci/check_sql_privileges_proposal.py)" = 'ddc624144c2a9f5d189d190498067cc6be03e26d'
          git diff --exit-code b677091a123c578082a1746350619b8033f2278c -- scripts/ci/visana_dev_privileges_proposal.sql src/main/resources/db/migration
          python3 -B -m py_compile scripts/ci/check_sql_privileges_proposal.py

      - name: Execute modified SQL proof twice with independent containers
        shell: bash
        run: |
          set -uo pipefail
          python3 -B scripts/ci/check_sql_privileges_proposal.py > "$RUNNER_TEMP/proof1.out" 2>&1
          rc1=$?
          python3 -B scripts/ci/check_sql_privileges_proposal.py > "$RUNNER_TEMP/proof2.out" 2>&1
          rc2=$?
          RC1="$rc1" RC2="$rc2" python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          report = {"candidateBlob": "ddc624144c2a9f5d189d190498067cc6be03e26d"}
          for n in (1, 2):
              raw = (temp / f"proof{n}.out").read_text(errors="replace")
              rc = int(os.environ[f"RC{n}"])
              entry = {"return_code": rc, "result": "FAIL"}
              if rc == 0:
                  lines = raw.splitlines()
                  ready = lines[0] if lines else ""
                  data = json.loads(lines[-1]) if lines else {}
                  assert "READY_STABLE_SUCCESSES=2" in ready
                  assert data.get("result") == "PASS"
                  assert data.get("objects") == {"tables": 23, "owned_by_app": True}
                  assert data.get("migrations") == "V1-V8 execute as the restricted role"
                  assert data.get("postgres_image") == "postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7"
                  assert data.get("readiness_transport") == "TCP"
                  assert data.get("readiness_stable_queries") == 2
                  entry.update({"result": "PASS", "readiness": ready,
                                "objects": data["objects"], "migrations": data["migrations"]})
              else:
                  entry["sanitized_output_tail"] = "\n".join(raw.splitlines()[-20:]).encode()[-4096:].decode(errors="replace")
              report[f"PRECOMMIT_SQL_PROOF_{n}"] = entry
          path = temp / "sql-proof-candidate-validation.json"
          path.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps({key: value["result"] for key, value in report.items() if key.startswith("PRECOMMIT_")}))
          if any(report[f"PRECOMMIT_SQL_PROOF_{n}"]["result"] != "PASS" for n in (1, 2)):
              raise SystemExit(1)
          PY

      - name: Upload sanitized candidate validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-proof-candidate-validation
          path: ${{ runner.temp }}/sql-proof-candidate-validation.json
          if-no-files-found: ignore
          retention-days: 14
