name: build

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode clean verify
