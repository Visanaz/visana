name: build

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/openapi-contract.yml
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine backend impact across the complete push
        id: scope
        run: python3 -B scripts/ci/backend_changes.py
  deploy-dev:
    needs: [verify, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.backend_changed == 'true'
    uses: ./.github/workflows/deploy-dev.yml
    with:
      backend_changed: ${{ needs.changes.outputs.backend_changed == 'true' }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      DEV_HEALTHCHECK_CLIENT_SECRET: ${{ secrets.DEV_HEALTHCHECK_CLIENT_SECRET }}
