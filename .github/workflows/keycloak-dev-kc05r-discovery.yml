name: KC05R_OIDC_DISCOVERY_READ_ONLY

on:
  push:
    branches: [ops/keycloak-dev-foundation]
    paths: [.github/workflows/keycloak-dev-kc05r-discovery.yml]

permissions:
  contents: read

concurrency:
  group: kc05r-oidc-discovery
  cancel-in-progress: false

jobs:
  discovery:
    if: >-
      github.repository == 'Visanaz/visana' &&
      github.ref == 'refs/heads/ops/keycloak-dev-foundation' &&
      github.actor == 'KmDRF' &&
      github.triggering_actor == 'KmDRF'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify PR before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import subprocess
          def api(path):
              process = subprocess.run(["gh", "api", path], capture_output=True,
                                       text=True, check=False)
              if process.returncode:
                  raise SystemExit("GITHUB_PREFLIGHT_UNAVAILABLE")
              return json.loads(process.stdout)
          permission = api("repos/Visanaz/visana/collaborators/KmDRF/permission")
          if permission.get("permission") not in ("write", "maintain", "admin"):
              raise SystemExit("ACTOR_PERMISSION_MISMATCH")
          pr = api("repos/Visanaz/visana/pulls/20")
          if not (pr.get("state") == "open" and pr.get("draft") is True
                  and pr.get("merged_at") is None and pr["base"]["ref"] == "dev"
                  and pr["head"]["sha"] == "8701fc5b377af72665dce210203e43c0433a1fbd"):
              raise SystemExit("PR_PREFLIGHT_MISMATCH")
          print("PR_PREFLIGHT=PASS")

      - name: Checkout exact certified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8701fc5b377af72665dce210203e43c0433a1fbd
          path: approved-source
          persist-credentials: false

      - name: Verify source configuration before cloud authentication
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          source = Path("approved-source")
          head = subprocess.check_output(["git", "-C", str(source),
                                          "rev-parse", "HEAD"], text=True).strip()
          if head != "8701fc5b377af72665dce210203e43c0433a1fbd":
              raise SystemExit("SOURCE_SHA_MISMATCH")
          conf = (source / "infra/keycloak/keycloak.conf").read_text(encoding="utf-8")
          dockerfile = (source / "infra/keycloak/Dockerfile").read_text(encoding="utf-8")
          if not all(line in conf.splitlines() for line in
                     ("hostname-strict=true", "proxy-headers=xforwarded")):
              raise SystemExit("SOURCE_HOSTNAME_CONFIG_MISMATCH")
          if not all(marker in dockerfile for marker in
                     ("KC_HEALTH_ENABLED=true", "KC_METRICS_ENABLED=true")):
              raise SystemExit("SOURCE_HEALTH_CONFIG_MISMATCH")
          manifest = Path(os.environ["RUNNER_TEMP"]) / "kc05r-source-render.json"
          rendered = subprocess.run([
              sys.executable, str(source / "scripts/ci/keycloak_dev.py"),
              "render", "--hostname",
              "https://visana-keycloak-dev-984938781030.us-central1.run.app",
              "--image", "us-central1-docker.pkg.dev/visana-erp-dev/visana-repo/"
              "visana-keycloak-dev@sha256:00462375f745a2f05afbc22b337fab23ae7a757846581edbab8f9afc14819b95",
              "--output", str(manifest)], capture_output=True, text=True, check=False)
          if rendered.returncode:
              raise SystemExit("SOURCE_RENDER_FAILED")
          spec = json.loads(manifest.read_text(encoding="utf-8"))["spec"]["template"]["spec"]
          env = {item["name"]: item.get("value") for item in spec["containers"][0]["env"]
                 if "value" in item}
          if env.get("KC_HOSTNAME") != (
              "https://visana-keycloak-dev-984938781030.us-central1.run.app"):
              raise SystemExit("SOURCE_RENDER_HOSTNAME_MISMATCH")
          print("SOURCE_CONFIG=PASS")

      - name: Authenticate exact DEV deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: visana-erp-dev

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Read-only OIDC discovery and service reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          project = "visana-erp-dev"
          region = "us-central1"
          service_name = "visana-keycloak-dev"
          revision_expected = "visana-keycloak-dev-00001-hzn"
          deployer = "github-actions-dev@visana-erp-dev.iam.gserviceaccount.com"
          hash_url = "https://visana-keycloak-dev-2f64hwbmbq-uc.a.run.app"
          deterministic_url = "https://visana-keycloak-dev-984938781030.us-central1.run.app"
          expected_issuer = deterministic_url + "/realms/visana-erp"
          expected_host = urllib.parse.urlparse(deterministic_url).hostname
          artifact = Path(os.environ["RUNNER_TEMP"]) / "kc05r-discovery-result.json"
          result = {
              "SOURCE_SHA": "8701fc5b377af72665dce210203e43c0433a1fbd",
              "SERVICE_NAME": service_name,
              "REVISION_BEFORE": "UNKNOWN", "REVISION_AFTER": "UNKNOWN",
              "HASH_HTTP_STATUS_UNAUTH": "UNKNOWN",
              "DETERMINISTIC_HTTP_STATUS_UNAUTH": "UNKNOWN",
              "DISCOVERY_HTTP_STATUS": "NOT_RUN", "OIDC_ISSUER": None,
              "AUTHORIZATION_HOST": None, "TOKEN_HOST": None, "JWKS_HOST": None,
              "HOSTNAME_BINDING_VALID": "UNKNOWN",
              "PUBLIC_INVOKER": "UNKNOWN", "PRIVATE_SERVICE": "UNKNOWN",
              "KC05_STATUS": "BLOCKED_DISCOVERY",
              "KC06_READY_FOR_AUTHORIZATION": "NO",
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def run(args):
              return subprocess.run(args, capture_output=True, text=True,
                                    timeout=90, check=False)

          def get_status(url, token=None):
              headers = {} if token is None else {
                  "X-Serverless-Authorization": "Bearer " + token}
              request = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with opener.open(request, timeout=30) as response:
                      body = response.read(65537)
                      return response.status, body
              except urllib.error.HTTPError as exc:
                  return exc.code, b""
              except (urllib.error.URLError, TimeoutError):
                  return "UNAVAILABLE", b""

          def service_metadata():
              process = run(["gcloud", "run", "services", "describe", service_name,
                             "--project=" + project, "--region=" + region,
                             "--format=json"])
              if process.returncode:
                  return None
              return json.loads(process.stdout)

          def revision(data):
              return data.get("status", {}).get("latestReadyRevisionName")

          def revisions_unchanged(data):
              status = data.get("status", {})
              return (status.get("latestReadyRevisionName") == revision_expected
                      and status.get("latestCreatedRevisionName") == revision_expected)

          def scaling_ok(data):
              annotations = data.get("metadata", {}).get("annotations", {})
              return (annotations.get("run.googleapis.com/minScale") == "1"
                      and annotations.get("run.googleapis.com/maxScale") == "1")

          def privacy(data):
              process = run(["gcloud", "run", "services", "get-iam-policy",
                             service_name, "--project=" + project,
                             "--region=" + region, "--format=json"])
              if process.returncode:
                  return "UNKNOWN", "UNKNOWN"
              policy = json.loads(process.stdout)
              public = any(binding.get("role") == "roles/run.invoker" and
                           any(member in ("allUsers", "allAuthenticatedUsers")
                               for member in binding.get("members", []))
                           for binding in policy.get("bindings", []))
              disabled = data.get("metadata", {}).get("annotations", {}).get(
                  "run.googleapis.com/invoker-iam-disabled") == "true"
              public = public or disabled
              return ("YES", "NO") if public else ("NO", "YES")

          try:
              active = run(["gcloud", "auth", "list", "--filter=status:ACTIVE",
                            "--format=value(account)"])
              if active.returncode or active.stdout.strip() != deployer:
                  raise RuntimeError("IDENTITY_MISMATCH")
              before = service_metadata()
              if before is None:
                  raise RuntimeError("SERVICE_METADATA_UNAVAILABLE")
              result["REVISION_BEFORE"] = revision(before) or "UNKNOWN"
              result["PUBLIC_INVOKER"], result["PRIVATE_SERVICE"] = privacy(before)
              if (not revisions_unchanged(before)
                  or not scaling_ok(before)
                  or result["PUBLIC_INVOKER"] != "NO"
                  or result["PRIVATE_SERVICE"] != "YES"):
                  raise RuntimeError("SERVICE_PRECHECK_MISMATCH")

              result["HASH_HTTP_STATUS_UNAUTH"], _ = get_status(hash_url)
              result["DETERMINISTIC_HTTP_STATUS_UNAUTH"], _ = get_status(deterministic_url)
              if (result["HASH_HTTP_STATUS_UNAUTH"] != 403
                  or result["DETERMINISTIC_HTTP_STATUS_UNAUTH"] != 403):
                  raise RuntimeError("UNAUTHENTICATED_ACCESS_MISMATCH")

              token_result = run(["gcloud", "auth", "print-identity-token", deployer,
                                  "--audiences=" + hash_url, "--include-email"])
              if token_result.returncode or not token_result.stdout.strip():
                  result["DISCOVERY_HTTP_STATUS"] = "TOKEN_UNAVAILABLE"
                  raise RuntimeError("IDENTITY_TOKEN_UNAVAILABLE")
              token = token_result.stdout.strip()
              discovery_url = hash_url + "/realms/visana-erp/.well-known/openid-configuration"
              result["DISCOVERY_HTTP_STATUS"], body = get_status(discovery_url, token)
              del token
              if result["DISCOVERY_HTTP_STATUS"] != 200 or len(body) > 65536:
                  raise RuntimeError("DISCOVERY_GET_FAILED")
              discovery = json.loads(body)
              result["OIDC_ISSUER"] = discovery.get("issuer")
              for field, target in (
                  ("authorization_endpoint", "AUTHORIZATION_HOST"),
                  ("token_endpoint", "TOKEN_HOST"),
                  ("jwks_uri", "JWKS_HOST")):
                  value = discovery.get(field)
                  result[target] = (urllib.parse.urlparse(value).hostname
                                    if isinstance(value, str) else None)
              body = b""
              discovery = None

              after = service_metadata()
              if after is None:
                  raise RuntimeError("POST_SERVICE_METADATA_UNAVAILABLE")
              result["REVISION_AFTER"] = revision(after) or "UNKNOWN"
              after_public, after_private = privacy(after)
              result["PUBLIC_INVOKER"] = after_public
              result["PRIVATE_SERVICE"] = after_private
              if (not revisions_unchanged(after)
                  or not scaling_ok(after) or after_public != "NO"
                  or after_private != "YES"):
                  raise RuntimeError("SERVICE_POSTCHECK_MISMATCH")

              binding = (result["OIDC_ISSUER"] == expected_issuer and
                         result["AUTHORIZATION_HOST"] == expected_host and
                         result["TOKEN_HOST"] == expected_host and
                         result["JWKS_HOST"] == expected_host)
              result["HOSTNAME_BINDING_VALID"] = "YES" if binding else "NO"
              if not binding:
                  raise RuntimeError("OIDC_HOSTNAME_CONTRACT_MISMATCH")
              result["KC05_STATUS"] = "PASS"
              result["KC06_READY_FOR_AUTHORIZATION"] = "YES"
          except (RuntimeError, ValueError, KeyError, OSError,
                  subprocess.TimeoutExpired):
              if result["DISCOVERY_HTTP_STATUS"] == 200:
                  result["HOSTNAME_BINDING_VALID"] = "NO" if result["OIDC_ISSUER"] else "UNKNOWN"
              if result["REVISION_BEFORE"] != "UNKNOWN" and result["REVISION_AFTER"] == "UNKNOWN":
                  after = service_metadata()
                  if after is not None:
                      result["REVISION_AFTER"] = revision(after) or "UNKNOWN"
          finally:
              artifact.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
              print("KC05R_DISCOVERY_READ_ONLY_COMPLETE")

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kc05r-discovery-result
          path: ${{ runner.temp }}/kc05r-discovery-result.json
          if-no-files-found: warn
          retention-days: 14
