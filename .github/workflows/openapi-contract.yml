name: openapi-contract

on:
  pull_request:
    branches: [dev, qa, main]
    paths: [pom.xml, src/**, openapi/**, .github/workflows/openapi-contract.yml]
  push:
    branches: [dev, qa, main]
    paths: [pom.xml, src/**, openapi/**, .github/workflows/openapi-contract.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate runtime OpenAPI snapshot
        run: ./mvnw --batch-mode -DskipTests test-compile exec:java -Dexec.args=openapi/visana-api-v1.json
      - name: Detect OpenAPI contract drift
        run: git diff --exit-code -- openapi/visana-api-v1.json
